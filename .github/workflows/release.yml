name: Build and Release SEEP

# Se ejecuta automáticamente cada vez que creás un Tag en Git (ej: v1.0)
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (Poetry)
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Compilar con PyInstaller (Modo Directorio para evitar Antivirus)
        run: |
          # Compilamos en modo directorio (--onedir) y sin consola negra para el cliente
          poetry run pyinstaller --noconfirm --onedir --windowed --name "SEEP_Cliente" cliente_alumno.py

          # Compilamos el servidor
          poetry run pyinstaller --noconfirm --onedir --name "SEEP_Servidor" servidor_docente_2.py

      - name: Empaquetar en ZIP
        run: |
          # Comprimimos las carpetas generadas para distribución
          Compress-Archive -Path dist/SEEP_Cliente -DestinationPath SEEP_Cliente.zip
          Compress-Archive -Path dist/SEEP_Servidor -DestinationPath SEEP_Servidor.zip

      - name: Generar Hashes SHA-256
        run: |
          Get-FileHash SEEP_Cliente.zip, SEEP_Servidor.zip -Algorithm SHA256 > hashes.txt

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SEEP_Cliente.zip
            SEEP_Servidor.zip
            hashes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
